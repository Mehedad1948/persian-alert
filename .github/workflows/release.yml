name: Release

# Push a tag like v1.0.0 to build PersianAlert.exe and publish it as a GitHub release.
# Run manually from the Actions tab to build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $source = Get-Content src/PersianAlert.ahk -Raw
          $appVersion = [regex]::Match($source, 'APP_VERSION := "([^"]+)"').Groups[1].Value
          $exeVersion = [regex]::Match($source, ';@Ahk2Exe-SetVersion (\S+)').Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($appVersion -ne $tagVersion -or $exeVersion -ne $tagVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION ($appVersion) and SetVersion ($exeVersion)."
          }

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PersianAlert
          path: |
            dist/PersianAlert.exe
            dist/PersianAlert.exe.sha256
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          dist/PersianAlert.exe dist/PersianAlert.exe.sha256
          --repo $env:GITHUB_REPOSITORY
          --title "Persian Alert $env:GITHUB_REF_NAME"
          --generate-notes
